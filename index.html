<!DOCTYPE html>
<html lang="bn">
<head>fetch('https://raw.githubusercontent.com/yasserius/bangladesh_geojson_shapefile/main/small/small_bangladesh_geojson_adm3_492_upazila.Gopalganj)
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>বাংলাদেশ উপজেলা ভ্রমণ মানচিত্র</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
body{font-family:Arial,sans-serif;margin:0;background:#f0f7f2;color:#173b2b}
header{background:#087443;color:white;text-align:center;padding:15px}
main{max-width:900px;margin:auto;padding:15px}
input,button{padding:12px;font-size:16px;box-sizing:border-box}
input{width:100%;margin-bottom:8px;border:1px solid #aaa;border-radius:5px}
button{cursor:pointer;background:#087443;color:white;border:0;border-radius:5px}
#results button{display:block;width:100%;margin:4px 0;text-align:left}
#map{height:65vh;min-height:350px;border:2px solid #087443;border-radius:8px}
#status{background:white;padding:10px;border-radius:5px}
</style>
</head>

<body>
<header>
<h2>🇧🇩 আমার বাংলাদেশ ভ্রমণ</h2>
<p>উপজেলা খুঁজুন, মানচিত্রে নির্বাচন করুন</p>
</header>

<main>
<input id="search" placeholder="উপজেলার নাম লিখুন...">
<div id="results"></div>
<p id="status">উপজেলার মানচিত্র লোড হচ্ছে...</p>
<div id="map"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([23.8, 90.3], 7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const status = document.getElementById('status');
const results = document.getElementById('results');
const search = document.getElementById('search');

let geoLayer = null;
let allFeatures = [];
let selectedFeature = null;

function upazilaName(feature) {
  const p = feature.properties || {};
  return p.ADM3_EN || p.ADM3_BN ||
         p.NAME_3 || p.name || p.NAME ||
         p.upazila || p.shapeName || 'নাম পাওয়া যায়নি';
}

function normalise(text) {
  return String(text).toLowerCase().trim();
}

function selectUpazila(feature) {
  if (!geoLayer) return;

  selectedFeature = feature;

  geoLayer.eachLayer(layer => {
    geoLayer.resetStyle(layer);

    if (layer.feature === feature) {
      layer.setStyle({
        color: '#006400',
        fillColor: '#00cc66',
        fillOpacity: 0.85,
        weight: 3
      });

      map.fitBounds(layer.getBounds());
    }
  });

  status.textContent = 'নির্বাচিত উপজেলা: ' + upazilaName(feature);Gopalganj
}

search.addEventListener('input', function() {
  const query = normalise(this.value);
  results.innerHTML = '';

  if (!query) return;

  const matches = allFeatures.filter(feature =>
    normalise(upazilaName(feature)).includes(query)
  ).slice(0, 15);

  if (matches.length === 0) {
    results.textContent = 'উপজেলা পাওয়া যায়নি। ইংরেজি নামেও চেষ্টা করুন।';
    return;
  }

  matches.forEach(feature => {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = upazilaName(feature);

    button.onclick = () => {
      selectUpazila(feature);
      results.innerHTML = '';
    };

    results.appendChild(button);
  });
});

fetch('https://raw.githubusercontent.com/yasserius/bangladesh_geojson_shapefile/main/small/small_bangladesh_geojson_adm3_492_upozila.json')
  .then(response => {
    if (!response.ok) throw new Error('উপজেলার ডেটা লোড হয়নি');
    return response.json();
  })
  .then(data => {
    allFeatures = data.features || [];

    geoLayer = L.geoJSON(data, {
      style: {
        color: '#26734d',
        weight: 1,
        fillColor: '#b8dfc8',
        fillOpacity: 0.45
      },

      onEachFeature: (feature, layer) => {
        layer.bindTooltip(upazilaName(feature));

        layer.on('click', () => {
          selectUpazila(feature);
        });
      }
    }).addTo(map);

    map.fitBounds(geoLayer.getBounds());

    status.textContent =
      'মানচিত্র প্রস্তুত! মোট মানচিত্রের সীমানা: ' +
      allFeatures.length + 'টি। উপজেলা সার্চ করুন।';
  })
  .catch(error => {
    status.textContent =
      'উপজেলার মানচিত্রের ডেটা লোড হয়নি। ইন্টারনেট পরীক্ষা করে পেজ রিফ্রেশ করুন।';
    console.error(error);
  });
</script>
</body>
</html>

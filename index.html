<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>বাংলাদেশ উপজেলা ভ্রমণ</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f7f2;color:#183b2b}
header{background:#08783e;color:white;text-align:center;padding:18px 10px}
main{max-width:1000px;margin:auto;padding:12px}
.card{background:white;padding:14px;margin-bottom:12px;border-radius:10px}
input{width:100%;padding:13px;font-size:16px;border:1px solid #aaa;border-radius:8px}
#results{max-height:220px;overflow:auto}
.result{padding:12px;border-bottom:1px solid #ddd;cursor:pointer}
.result:hover{background:#e0f5e8}
.stats{display:flex;gap:8px;text-align:center}
.stat{flex:1;padding:12px 3px;background:#e3f4e8;border-radius:8px}
.stat strong{display:block;font-size:22px}
button{padding:11px;margin:6px 4px 0 0;border:0;border-radius:7px;font-size:15px}
.green{background:#08783e;color:white}
#map{height:65vh;min-height:400px;border-radius:8px}
#status{font-size:14px;line-height:1.6}
</style>
</head>

<body>
<header>
<h2>🇧🇩 আমার উপজেলা ভ্রমণ</h2>
বাংলাদেশের উপজেলা খুঁজুন ও ভ্রমণের হিসাব রাখুন
</header>

<main>
<div class="card">
<input id="search" placeholder="উপজেলার নাম লিখুন — যেমন Dhaka">
<div id="results"></div>
</div>

<div class="card">
<div class="stats">
<div class="stat"><strong id="visitedCount">0</strong>ভ্রমণ করেছি</div>
<div class="stat"><strong id="remainingCount">—</strong>বাকি</div>
<div class="stat"><strong id="totalCount">0</strong>মোট উপজেলা</div>
</div>
</div>

<div class="card">
<div id="status">মানচিত্রের ডেটা লোড হচ্ছে...</div>
<button id="mark" class="green" disabled>✅ ভ্রমণ করেছি</button>
<button id="unmark" disabled>↩ চিহ্ন সরাও</button>
</div>

<div class="card"><div id="map"></div></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([23.685,90.3563],7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

const $=id=>document.getElementById(id);
let features=[],geoLayer=null,selected=null;
let visited=new Set();

try{
 visited=new Set(JSON.parse(localStorage.getItem('bdVisited')||'[]'));
}catch(e){}

function getName(f){
 const p=f.properties||{};
 const keys=[
  'ADM3_EN','ADM3_NAME','ADM3','NAME_3','NAME3',
  'UPAZILA','Upazila','upazila','name','NAME',
  'ADM3_BN','NAME_2','shapeName','Name'
 ];
 for(const k of keys){
  if(p[k]!==undefined && String(p[k]).trim())return String(p[k]).trim();
 }
 return '';
}

function getKey(f){
 const p=f.properties||{};
 return String(p.ADM3_PCODE||p.ADM3_CODE||p.GID_3||p.ID_3||getName(f)).toLowerCase();
}

function norm(s){
 return String(s||'').toLowerCase().normalize('NFD')
 .replace(/[\u0300-\u036f]/g,'').replace(/[\s_-]/g,'');
}

function style(f){
 const yes=visited.has(getKey(f));
 return {
  color:yes?'#075c32':'#668875',
  weight:yes?1.5:1,
  fillColor:yes?'#00c853':'#d9eadf',
  fillOpacity:yes?.8:.5
 };
}

function stats(){
 $('visitedCount').textContent=visited.size;
 $('totalCount').textContent=features.length;
 $('remainingCount').textContent=Math.max(0,features.length-visited.size);
}

function save(){
 localStorage.setItem('bdVisited',JSON.stringify([...visited]));
 stats();
 if(geoLayer)geoLayer.eachLayer(l=>l.setStyle(style(l.feature)));
}

function select(f,l){
 if(selected&&geoLayer)selected.setStyle(style(selected.feature));
 selected=l;
 l.setStyle({color:'#006b35',weight:3,fillColor:'#00e676',fillOpacity:.9});
 l.bringToFront();
 map.fitBounds(l.getBounds(),{padding:[20,20],maxZoom:11});
 $('status').textContent='নির্বাচিত উপজেলা: '+(getName(f)||'নাম পাওয়া যায়নি');
 $('mark').disabled=false;
 $('unmark').disabled=false;
}

function searchNames(q){
 $('results').replaceChildren();
 if(!q.trim())return;

 const needle=norm(q);
 const matches=features.filter(f=>{
  const p=f.properties||{};
  const text=[getName(f),p.ADM3_BN,p.ADM3_EN,p.NAME_3,
   p.ADM2_EN,p.DISTRICT,p.DISTRICT_EN,p.DISTRICT_BN]
   .filter(Boolean).join(' ');
  return norm(text).includes(needle);
 }).slice(0,40);

 if(!matches.length){
  const d=document.createElement('div');
  d.className='result';
  d.textContent='নাম পাওয়া যায়নি।';
  $('results').appendChild(d);
  return;
 }

 matches.forEach(f=>{
  const d=document.createElement('div');
  d.className='result';
  d.textContent=getName(f)||'নাম নেই';
  d.onclick=()=>{
   const l=geoLayer.getLayers().find(x=>x.feature===f);
   if(l){
    select(f,l);
    $('search').value=getName(f);
    $('results').replaceChildren();
   }
  };
  $('results').appendChild(d);
 });
}

$('search').addEventListener('input',e=>searchNames(e.target.value));

$('mark').onclick=()=>{
 if(!selected)return;
 visited.add(getKey(selected.feature));
 save();
 $('status').textContent='ভ্রমণের তালিকায় যোগ হয়েছে: '+getName(selected.feature);
};

$('unmark').onclick=()=>{
 if(!selected)return;
 visited.delete(getKey(selected.feature));
 save();
 $('status').textContent='ভ্রমণের চিহ্ন সরানো হয়েছে: '+getName(selected.feature);
};

async function load(){
 const urls=[
 'https://raw.githubusercontent.com/yasserius/bangladesh_geojson_shapefile/main/small/small_bangladesh_geojson_adm3_492_upozila.json',
 'https://raw.githubusercontent.com/yasserius/bangladesh_geojson_shapefile/master/small/small_bangladesh_geojson_adm3_492_upozila.json'
 ];

 let data=null,lastError=null;

 for(const url of urls){
  try{
   const r=await fetch(url);
   if(!r.ok)throw Error('HTTP '+r.status);
   const j=await r.json();
   if(!j.features||!j.features.length)throw Error('ডেটা খালি');
   data=j;
   break;
  }catch(e){lastError=e;}
 }

 if(!data){
  console.error(lastError);
  $('status').textContent='উপজেলার ডেটা লোড হয়নি। ইন্টারনেট বা ডেটা লিংকে সমস্যা হয়েছে।';
  return;
 }

 features=data.features;
 geoLayer=L.geoJSON(data,{
  style:style,
  onEachFeature:(f,l)=>{
   l.bindTooltip(getName(f)||'উপজেলা',{sticky:true});
   l.on('click',()=>select(f,l));
  }
 }).addTo(map);

 map.fitBounds(geoLayer.getBounds());
 stats();
 $('status').textContent='মানচিত্র লোড হয়েছে। '+features.length+'টি এলাকার ডেটা পাওয়া গেছে। এখন সার্চ করুন।';
}

load();
</script>
</body>
</html>
